services:
  postgres:
    image: postgres:17-alpine
    container_name: tracehawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracehawk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["security-test"]
    ports:
      - "127.0.0.1:3000:3000"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security-test"]
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.key=${ZAP_API_KEY:-tracehawk-local-test-key}", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./zap-import:/zap/import:ro

volumes:
  postgres_data:
    name: tracehawk_postgres_data
