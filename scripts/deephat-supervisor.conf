[program:tracehawk-deephat]
command=/bin/bash /workspace/tracehawk-deephat-serve.sh
directory=/workspace
autostart=true
autorestart=unexpected
startsecs=20
startretries=2
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/tracehawk-deephat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
